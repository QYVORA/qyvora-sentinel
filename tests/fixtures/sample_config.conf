# QYVORA Sentinel - Sample Test Configuration
# This file is used by the test suite to verify config parsing.

[general]
verbose = true
log_level = debug
log_file = /tmp/sentinel-test.log
scan_timeout = 600

[paths]
scan_root = /tmp
excluded_paths = /proc,/sys,/dev

[checks]
enable_suid = true
enable_sgid = false
enable_world_writable = true
enable_capabilities = false
enable_sticky = true

[output]
format = json
color = off
report_dir = /tmp/sentinel-reports

[modules]
enable_all = false
enabled = filesystem,ssh,users
disabled = persistence

[severity]
minimum = LOW

[performance]
parallel = true
threads = 2
cache = false
