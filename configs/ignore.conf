# QYVORA Sentinel Ignore Configuration
# Paths, users, and processes to skip during scanning

[paths]
# Filesystem paths to ignore (one per line or comma-separated)
/usr/lib/systemd
/usr/share/doc
/usr/share/man
/usr/share/info
/usr/share/locale
/var/lib/dpkg
/var/lib/rpm
/proc
/sys
/dev
/run/user

# Known safe SUID binaries (one per line)
safe_suid = /usr/bin/su
safe_suid = /usr/bin/sudo
safe_suid = /usr/bin/passwd
safe_suid = /usr/bin/chsh
safe_suid = /usr/bin/chfn
safe_suid = /usr/bin/newgrp
safe_suid = /usr/bin/gpasswd
safe_suid = /usr/bin/mount
safe_suid = /usr/bin/umount
safe_suid = /usr/bin/pkexec
safe_suid = /usr/bin/fusermount
safe_suid = /usr/bin/fusermount3
safe_suid = /usr/bin/crontab
safe_suid = /usr/bin/at
safe_suid = /usr/bin/wall
safe_suid = /usr/bin/write
safe_suid = /usr/bin/ssh-agent

[users]
# System users to ignore (one per line)
ignore_user = root
ignore_user = nobody
ignore_user = daemon
ignore_user = bin
ignore_user = sys
ignore_user = sync
ignore_user = games
ignore_user = man
ignore_user = lp
ignore_user = mail
ignore_user = news
ignore_user = uucp
ignore_user = proxy
ignore_user = www-data
ignore_user = backup
ignore_user = list
ignore_user = irc
ignore_user = gnats
ignore_user = systemd-network
ignore_user = systemd-resolve
ignore_user = systemd-timesync
ignore_user = messagebus
ignore_user = syslog
ignore_user = _apt
ignore_user = polkitd
ignore_user = sshd

[processes]
# Known safe processes to ignore (one per line)
ignore_process = systemd
ignore_process = kthreadd
ignore_process = migration
ignore_process = ksoftirqd
ignore_process = kworker
ignore_process = rcu_
ignore_process = watchdog
ignore_process = khungtaskd
ignore_process = oom_reaper
ignore_process = writeback
ignore_process = kcompactd0
ignore_process = kblockd
ignore_process = ata_
ignore_process = scsi_
ignore_process = nfit
ignore_process = md_
ignore_process = dm-
ignore_process = xfs
ignore_process = jbd2

[cron]
# Safe system cron entries to ignore
ignore_cron_path = /etc/crontab
ignore_cron_path = /etc/cron.d
ignore_cron_path = /etc/cron.daily
ignore_cron_path = /etc/cron.hourly
ignore_cron_path = /etc/cron.weekly
ignore_cron_path = /etc/cron.monthly

[modules]
# Module-specific ignores can be added here
# Format: module_name.ignore_key = value
