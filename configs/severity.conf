# QYVORA Sentinel Severity Configuration
# Defines severity levels, scoring, and display settings

[levels]
# Severity level definitions
INFO = Informational findings that provide context
LOW = Minor issues or observations requiring attention
MEDIUM = Security concerns that should be addressed
HIGH = Significant security risks requiring prompt action
CRITICAL = Critical vulnerabilities requiring immediate response

[scoring]
# Points per finding of each severity
CRITICAL = 25
HIGH = 15
MEDIUM = 8
LOW = 3
INFO = 0

[thresholds]
# Risk score ranges
EXCELLENT = 0-20
GOOD = 21-40
MODERATE = 41-60
HIGH_RISK = 61-80
CRITICAL_RISK = 81-100

[display]
# Icons for each severity
INFO_ICON = ●
LOW_ICON = ◆
MEDIUM_ICON = ◆
HIGH_ICON = ▲
CRITICAL_ICON = ✖
SUCCESS_ICON = ✔
WARNING_ICON = ⚠

# Colors for each severity (ANSI names)
INFO_COLOR = cyan
LOW_COLOR = green
MEDIUM_COLOR = yellow
HIGH_COLOR = red
CRITICAL_COLOR = magenta
SUCCESS_COLOR = green
WARNING_COLOR = yellow
