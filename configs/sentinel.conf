# QYVORA Sentinel Configuration
# Main configuration file

[general]
# Scan mode: quick, standard, deep
scan_mode = standard
# Maximum execution time per module (seconds)
module_timeout = 300
# Maximum total scan time (seconds) 
total_timeout = 3600
# Enable colored output
color = auto
# Language
language = en

[output]
# Default output format: text, json, markdown, html
default_format = text
# Output directory for reports
output_dir = /var/log/sentinel/reports
# Enable verbose output
verbose = false
# Enable debug output
debug = false
# Quiet mode
quiet = false

[logging]
# Log level: debug, info, warning, error
level = info
# Log file path
log_file = /var/log/sentinel/sentinel.log
# Enable file logging
file_logging = true
# Max log file size (MB) before rotation
max_log_size = 10
# Number of rotated logs to keep
max_log_files = 5

[modules]
# Enable all modules by default
enable_all = true
# Explicitly enabled modules (comma-separated)
enabled = 
# Explicitly disabled modules (comma-separated)
disabled = 

[scan]
# Directories to scan
scan_dirs = /etc,/usr,/var,/home,/tmp,/opt,/root
# Skip network-intensive checks
skip_network = false
# Skip permission checks
skip_permissions = false
# Maximum file depth for filesystem scanning
max_depth = 10
# Minimum file size to ignore (bytes)
min_file_size = 0
# Maximum file size to scan (bytes)
max_file_size = 104857600
# Include hidden files
include_hidden = true
# Follow symlinks
follow_symlinks = false

[severity]
# Minimum severity to report: INFO, LOW, MEDIUM, HIGH, CRITICAL
minimum = INFO
# Enable CRITICAL findings
enable_critical = true
# Enable HIGH findings
enable_high = true
# Enable MEDIUM findings
enable_medium = true
# Enable LOW findings
enable_low = true
# Enable INFO findings
enable_info = true

[performance]
# Parallel module execution
parallel = false
# Number of parallel threads (if enabled)
threads = 4
# Enable caching
cache = true
# Cache directory
cache_dir = /tmp/sentinel/cache
# Cache TTL (seconds)
cache_ttl = 3600

[baseline]
# Baseline storage directory
baseline_dir = /var/lib/sentinel/baselines
# Auto-save baseline after scan
auto_save = false
# Baseline name prefix
name_prefix = baseline

[plugins]
# Plugin directory
plugin_dir = /usr/share/sentinel/plugins
# Enable plugin support
enabled = true

[risk]
# Risk score weights
critical_weight = 25
high_weight = 15
medium_weight = 8
low_weight = 3
info_weight = 0
# Risk thresholds
excellent_max = 20
good_max = 40
moderate_max = 60
high_risk_max = 80
# Anything above 80 is critical
