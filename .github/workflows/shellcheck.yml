name: ShellCheck

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.bash'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.bash'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: find . -name '*.sh' -o -name '*.bash' | xargs shellcheck --severity=warning
